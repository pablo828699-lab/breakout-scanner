name: Hourly Market Scan

on:
  schedule:
    # Runs at the 1st minute of every hour
    - cron: '1 * * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scan Cycle & Send Telegram Alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          DRY_RUN: 'false'
        run: |
          python -m backend.main --once

      - name: Sync signals to Render backend
        if: always()
        run: |
          echo "Syncing capitulation signals..."
          curl -s --retry 5 --retry-delay 10 --retry-connrefused --max-time 60 -X POST -H "Content-Type: application/json" --data-binary @backend/capitulation_signals.json https://breakout-scanner-xg9f.onrender.com/api/capitulation || echo "Capitulation sync warning"
          echo "Syncing candidate signals..."
          curl -s --retry 5 --retry-delay 10 --retry-connrefused --max-time 60 -X POST -H "Content-Type: application/json" --data-binary @backend/recent_signals.json https://breakout-scanner-xg9f.onrender.com/api/candidates || echo "Candidates sync warning"

      - name: Commit and push changes
        if: always()
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add backend/recent_signals.json backend/last_alerts.json backend/capitulation_signals.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update recent signals and capitulations [skip ci]"
            git push || echo "Git push failed or permission denied - skipping push"
          else
            echo "No signal changes to commit."
          fi
